plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

group = project.findProperty("maven_group") ?: "madoku.craft"
version = project.findProperty("mod_version") ?: "0.0.0-dev"

base {
	archivesName = project.findProperty("archives_base_name") ?: "madoku-craft-core"
}

repositories {
	mavenCentral()
	maven {
		name = "CurseMaven"
		url = "https://www.cursemaven.com"
		content { includeGroup "curse.maven" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"madoku-craft-core" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java {
			srcDir "src/main/server"
		}
	}
	client {
		java {
			srcDir "src/main/client"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional client-side integrations, matching the original runClient setup.
	modImplementation "curse.maven:sodium-394468:${project.sodium_id}"
	modImplementation "curse.maven:irisshaders-455508:${project.iris_id}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	inputs.property "fabric_api_version", project.fabric_api_version
	filesMatching("fabric.mod.json") {
		expand "version": project.version,
			"minecraft_version": project.minecraft_version,
			"loader_version": project.loader_version,
			"fabric_api_version": project.fabric_api_version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
